<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batteries VE">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Batteries VE</title>
<style>
:root{
  --bg:#f2f5f6;--card:#fff;--text:#16212a;--muted:#667684;--line:#dfe6ea;
  --primary:#0f4c5c;--primary-2:#1b6f85;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545;
  --chip:#eaf1f3;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1418;--card:#172128;--text:#e6eef2;--muted:#8b9ba6;--line:#26343d;
  --primary:#3aa0b8;--primary-2:#5bbbd2;--chip:#20303a;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header{flex-wrap:wrap}
.topwrap{position:sticky;top:0;z-index:10}
.topwrap header{position:relative}
.bkbar{display:block;width:100%;border:0;text-align:left;padding:9px 16px;font-size:13.5px;font-weight:600;line-height:1.3;color:#fff;background:#8a96a0}
.bkbar.orange{background:#e07b00}
.bkbar.vert{background:#1f9d55}
.ver{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 4px}
.odbar{flex-basis:100%;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 6px 6px 10px;font-size:13px;line-height:1.25;margin-top:2px}
.odbar[hidden]{display:none}
.odbar .grow{flex:1}
.odbar button{border:0;border-radius:8px;font-size:13px;font-weight:700;padding:8px 10px;white-space:nowrap}
.odbar .yes{background:#fff;color:var(--primary)}
.odbar .no{background:transparent;color:#fff;opacity:.85;padding:8px 6px}
header h1{font-size:19px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{position:relative;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
.back{font-size:26px;line-height:1;padding:0 6px 2px 0}
.badge{position:absolute;top:-2px;right:0;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.oddot{position:absolute;right:4px;bottom:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--primary);background:#9aa5b1}
.oddot.ok{background:#2ecc71}.oddot.wait{background:#ffc107}.oddot.err{background:#e74c3c}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span.i{font-size:21px}
nav button.active{color:var(--primary)}
nav .badge{top:4px;right:calc(50% - 22px)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--chip);color:var(--text)}
.btn.primary{background:var(--primary);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%;margin-top:8px}
.btn.small{padding:7px 10px;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h2{font-size:17px;margin:14px 0 10px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:16px;padding:7px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;margin:4px 4px 0 0}
.pill.ok{background:#e3f4ea;color:#17703f}.pill.warn{background:#fff1d6;color:#8a5a00}.pill.bad{background:#fde8e8;color:var(--bad)}.pill.info{background:#e3eef2;color:var(--primary-2)}
@media (prefers-color-scheme: dark){.pill.ok{background:#173a26;color:#7fd8a1}.pill.warn{background:#3a2c10;color:#f3c66b}.pill.bad{background:#3a1d1d;color:#ff8f8f}.pill.info{background:#1d2f38;color:#8fd0e2}}
.meas{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.meas span{background:var(--chip);border-radius:8px;padding:4px 8px}
.bat{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.unit{display:flex;gap:4px}
.unit .chip{padding:7px 10px}
.preview{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:52vh;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.center{text-align:center}
.prog{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:8px}
.prog>div{height:100%;background:var(--ok)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.undobar{position:fixed;left:12px;right:12px;bottom:calc(var(--navh,60px) + 8px);max-width:676px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;z-index:31;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .25s,opacity .25s,visibility .25s}
.undobar.show{transform:none;opacity:1;visibility:visible;pointer-events:auto}
.undobar span{flex:1}
.undobar button{border:0;border-radius:8px;background:#ffc107;color:#222;font-weight:700;font-size:14px;padding:9px 12px}
body.undo-on main{padding-bottom:calc(var(--navh,60px) + 90px + env(safe-area-inset-bottom))}
body.undo-on .fab{bottom:calc(var(--navh,60px) + 76px)}
body.undo-on .toast{bottom:calc(var(--navh,60px) + 130px)}
.alertbar{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;align-items:center;gap:8px;background:#fff4e0;color:#8a5a00;border:1px solid #f1d39a}
.alertbar.bad{background:#fde8e8;color:var(--bad);border-color:#f3b4b4}
@media (prefers-color-scheme: dark){.alertbar{background:#3a2c10;color:#f3c66b;border-color:#5a4418}.alertbar.bad{background:#3a1d1d;color:#ff8f8f;border-color:#5a2a2a}}
.odstat{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.check{width:24px;height:24px;flex:none;accent-color:var(--primary)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:10px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;font-size:15px;padding:10px 6px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
details.sec{padding:0 12px}
details.sec>summary{list-style:none;cursor:pointer;font-weight:700;font-size:16px;padding:14px 0;display:flex;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'›';margin-left:auto;font-size:22px;color:var(--muted);transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec[open]{padding-bottom:12px}
.vrow{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.shr{font-style:normal;display:inline-block;font-size:11px;font-weight:700;color:var(--accent,#0f766e);background:rgba(15,118,110,.12);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
.tick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font-size:14px;color:var(--text)}
.tick span{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.tick.on span{background:var(--ok);border-color:var(--ok)}
.rtab{margin-top:6px}
.rh,.rr{display:flex;align-items:center;gap:4px}
.rh{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:4px}
.rr{border-top:1px solid var(--line);padding:6px 0;font-size:14px;min-height:46px}
.rr.dim>.grow{color:var(--muted)}
.ccol{width:46px;flex:none;display:flex;justify-content:center;text-align:center}
.qcol{width:88px;flex:none;display:flex;justify-content:center;text-align:center}
.box{width:36px;height:36px;border-radius:9px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:17px;color:#fff;padding:0}
.box.on{background:var(--ok);border-color:var(--ok)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:30px;height:34px;border:0;border-radius:8px;background:var(--chip);color:var(--text);font-size:18px;font-weight:700;padding:0}
.step b{min-width:22px;text-align:center}
.rname{padding:7px;font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 input{padding:9px 6px;font-size:15px}
.ess{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:4px 2px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;min-height:44px}
.ess small{font-size:10px;font-weight:600;color:var(--muted)}
.ess.ok{background:#e3f4ea;border-color:var(--ok);color:#17703f}
.ess.nok{background:#fde8e8;border-color:var(--bad);color:var(--bad)}
@media (prefers-color-scheme: dark){.ess.ok{background:#173a26;color:#7fd8a1}.ess.nok{background:#3a1d1d;color:#ff8f8f}}
.sigbox{width:100%;height:84px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--muted);font-size:14px;padding:4px;display:flex;align-items:center;justify-content:center}
.sigbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.sigfull{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.sigbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.sigbar .btn{margin:0}
.sigarea{position:relative;flex:1;margin:10px;background:#fff;border:2px dashed var(--line);border-radius:12px;overflow:hidden}
.sigarea canvas{position:absolute;inset:0;touch-action:none}
.sigline{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #c9d2d8;pointer-events:none}
.sighint{position:absolute;left:0;right:0;bottom:calc(28% - 22px);text-align:center;color:#9aa6b0;font-size:13px;pointer-events:none}
.sigcv{width:100%;height:200px;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block;margin:8px 0}
</style>
</head>
<body>

<div class="topwrap"><header>
  <button class="hbtn back" id="backBtn" onclick="goBack()" hidden aria-label="Retour">‹</button>
  <h1 id="title">🔋 Batteries VE</h1>
</header>
<button class="bkbar" id="bkBar" onclick="sendBackup()"></button></div>

<main id="view"></main>
<button class="fab" id="fab" onclick="fabAction()" aria-label="Ajouter">+</button>

<nav>
  <button data-tab="ves" class="active" onclick="go('ves')"><span class="i">📋</span>VE</button>
  <button data-tab="sites" onclick="go('sites')"><span class="i">🏢</span>Sites</button>
  <button data-tab="bats" onclick="go('bats')"><span class="i">🔋</span>Batteries<span class="badge" id="batBadge" hidden>0</span></button>
  <button data-tab="settings" onclick="go('settings')"><span class="i">⚙️</span>Réglages</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this){closeSheet();render()}"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="undobar" id="undoBar"><span id="undoMsg"></span><button onclick="undo()">↩️ Annuler</button></div>
<input type="file" id="impTpl" accept=".pdf,application/pdf" multiple hidden onchange="importTpl([...this.files]);this.value=''">
<input type="file" id="impBk" hidden onchange="loadBackup(this.files[0]);this.value=''">
<input type="file" id="impJson" accept=".json,application/json,text/plain,application/octet-stream" hidden onchange="importData(this.files[0]);this.value=''">

<script src="msal-browser.min.js"></script>
<script src="xlsx-lite.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script>
/* ============ Version ============ */
const APP_VERSION = '3.1';
const APP_DATE = '19/11/2026';

/* ============ Données ============ */
const KEY = 'batteriesVE_v1';
const CAPS = [2.1, 7, 17, 18, 24, 36];
// Capacité affichée à la française : 2.1 → « 2,1 »
const fmtCap = c => (c === null || c === undefined || c === '') ? '?' : String(c).replace('.', ',');
const MAIL_SUBJECT = '{fiche} – {site} – VE du {date}';
const MAIL_BODY = 'Bonjour,\n\nVeuillez trouver ci-joint {fiches} de la visite d\'entretien du site {site} ({date}), en deux versions :\n- PDF non modifiable, pour l\'archivage ;\n- PDF modifiable, si une correction est nécessaire.\n\nCordialement,\n{tech}';
const defaults = () => ({
  sites: [],      // {id, name}
  ves: [],        // {id, siteId, start, end, closed, coffrets:[...], carnet, carnetEdited}
  settings: {ageYears: 4, warnMonths: 6, tech: '', mailTo: '', mailSubject: MAIL_SUBJECT, mailBody: MAIL_BODY, odClientId: '850f4eca-b80e-4b18-aa2a-33d7855f04bf'}, // appli « BATTERIES VE » chez Microsoft (non secret)
  lastBackup: 0
});
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = defaults(), saved = JSON.parse(s), st = Object.assign({}, d.settings, saved.settings || {}); if (!st.odClientId) st.odClientId = d.settings.odClientId; if (!st.mailSubject) st.mailSubject = MAIL_SUBJECT; if (!st.mailBody) st.mailBody = MAIL_BODY; return Object.assign(d, saved, {settings: st}); }
  } catch(e){}
  return defaults();
}
let S = load();
try { S.ves.forEach(v => v.coffrets.sort((a, b) => (!a.label - !b.label) || String(a.label || '').localeCompare(String(b.label || ''), 'fr', {numeric: true, sensitivity: 'base'}))); } catch(e){}
// Coffrets toujours rangés par ordre alphabétique (les coffrets sans nom à la fin)
const cmpTxt = (a, b) => a.localeCompare(b, 'fr', {numeric: true, sensitivity: 'base'});
const cmpCoffret = (a, b) => (!a.label - !b.label) || cmpTxt(a.label || '', b.label || '') || cmpTxt(a.loc || '', b.loc || '');
function sortCoffrets(){ S.ves.forEach(v => v.coffrets.sort(cmpCoffret)); }
// Sauvegarde OneDrive par le menu Partager : on garde dans le téléphone la date de dernière modification
// et la date du dernier envoi réussi (le bandeau reste orange même après fermeture de l'appli)
const BKKEY = 'batteriesVE_sauvegarde';
let BK = (() => { try { return JSON.parse(localStorage.getItem(BKKEY)) || {}; } catch(e){ return {}; } })();
const saveBK = () => { try { localStorage.setItem(BKKEY, JSON.stringify(BK)); } catch(e){} };
let quietSave = false;
function save(){
  sortCoffrets();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (!quietSave) { BK.lastMod = Date.now(); saveBK(); try { bkUi(); } catch(e){} }
  updateBadges();
  try { odDirty(); } catch(e){}
}
let storageOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ storageOK = false; }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

/* ============ Utilitaires ============ */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = t => t ? new Date(t).toLocaleDateString('fr-FR') : '';
const fmtDate = t => new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dayInput = t => { const d = new Date(t); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const thisMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g,'')); return isNaN(n) ? null : n; };
const fmtNum = v => v === null || v === '' || v === undefined ? '' : String(v).replace('.', ',');
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
const siteName = id => (S.sites.find(s => s.id === id) || {name:'Site inconnu'}).name;
const typeLabel = t => t === 'ca' ? 'Contrôle d\'accès' : 'Alarme';
const typeIcon = t => t === 'ca' ? '🚪' : '🚨';

/* ============ Âge des batteries ============ */
function ageMonths(pose){
  if (!pose) return null;
  const [y, m] = pose.split('-').map(Number); if (!y || !m) return null;
  const d = new Date(); return (d.getFullYear() - y) * 12 + (d.getMonth() + 1 - m);
}
function ageText(mo){
  if (mo === null) return 'date de pose inconnue';
  if (mo < 0) return 'date future';
  const y = Math.floor(mo / 12), m = mo % 12;
  return (y ? y + ' an' + (y > 1 ? 's' : '') : '') + (y && m ? ' ' : '') + (m || !y ? m + ' mois' : '');
}
function batStatus(b){ // 'bad' | 'warn' | 'ok' | 'unknown'
  const mo = ageMonths(b.pose); if (mo === null) return 'unknown';
  const lim = (+S.settings.ageYears || 4) * 12, warn = +S.settings.warnMonths || 6;
  return mo >= lim ? 'bad' : (mo >= lim - warn ? 'warn' : 'ok');
}
const fmtPose = p => p ? p.split('-').reverse().join('/') : '—';
function batPill(b){
  const st = batStatus(b);
  const lab = {bad: '⚠️ à remplacer', warn: '⏳ à prévoir', ok: '✓', unknown: '? date'}[st];
  return `<span class="pill ${st === 'unknown' ? 'info' : st}">12V ${fmtCap(b.cap)}Ah · ${fmtPose(b.pose)} · ${b.pose ? ageText(ageMonths(b.pose)) : ''} ${lab}</span>`;
}

/* ============ Navigation ============ */
let tab = 'ves', curVe = null, curSite = null, fromSite = false;
function go(t, veId){
  if (t === 'ves' || t === 'sites' || t === 'bats' || t === 'settings') fromSite = false;
  if (t === 'site') { if (veId) curSite = veId; fromSite = true; curVe = null; } else curVe = veId || null;
  tab = t;
  const navTab = t === 'site' ? 'sites' : (t === 've' || t === 'fiche') ? (fromSite ? 'sites' : 'ves') : t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === navTab));
  render(); window.scrollTo(0,0);
}
function goBack(){
  if (tab === 'fiche') { veMode = 'vce'; go('ve', curVe); }
  else if (tab === 've' && fromSite) { const ve = S.ves.find(v => v.id === curVe); go('site', ve ? ve.siteId : curSite); }
  else if (tab === 'site') go('sites');
  else go('ves');
}
function render(){
  const ve = curVe && S.ves.find(v => v.id === curVe);
  if ((tab === 've' || tab === 'fiche') && !ve) tab = fromSite ? 'site' : 'ves';
  const site = tab === 'site' && S.sites.find(x => x.id === curSite);
  if (tab === 'site' && !site) tab = 'sites';
  $('backBtn').hidden = !['ve', 'fiche', 'site'].includes(tab);
  $('title').textContent = tab === 'fiche' ? VCE[curType].short + ' · ' + siteName(ve.siteId) : tab === 've' ? siteName(ve.siteId) : tab === 'site' ? '🏢 ' + site.name : tab === 'sites' ? '🏢 Mes sites' : '🔋 Batteries VE';
  $('fab').style.display = (tab === 'ves' || tab === 'sites' || tab === 'site' || (tab === 've' && veMode === 'bat')) ? '' : 'none';
  ({ves: renderVes, ve: () => renderVe(ve), fiche: () => renderFiche(ve), sites: renderSites, site: () => renderSite(site), bats: renderBats, settings: renderSettings})[tab]();
  $('view').insertAdjacentHTML('beforeend', `<div class="ver">Batteries VE · version ${APP_VERSION}</div>`);
  updateBadges(); bkUi();
}
function fabAction(){ tab === 've' ? addCoffret() : tab === 'sites' ? editSite() : tab === 'site' ? newVe(siteName(curSite)) : newVe(); }

/* ============ Liste des VE ============ */
function veProgress(ve){
  const n = ve.coffrets.length, d = ve.coffrets.filter(c => coffretDone(c)).length;
  return {n, d};
}
function coffretMissing(c){
  const m = [];
  if (!c.bats.length) m.push('batterie');
  else if (c.bats.some(b => !(b.cap > 0))) m.push('capacité batterie');
  if (num(c.vOn) === null) m.push('sous tension');
  if (num(c.vOff) === null) m.push('hors tension');
  if (num(c.conso) === null) m.push('conso');
  return m;
}
const coffretDone = c => !coffretMissing(c).length;
function veCard(ve){
  const {n, d} = veProgress(ve);
  const bad = ve.coffrets.reduce((s, c) => s + c.bats.filter(b => batStatus(b) === 'bad').length, 0);
  return `<div class="card tap" onclick="veMode='bat';go('ve','${ve.id}')">
    <div class="row"><div class="grow">
      <div class="name">${ve.closed ? '✅' : '🟢'} ${esc(siteName(ve.siteId))}</div>
      <div class="sub">${ve.closed ? `Du ${fmtDay(ve.start)} au ${fmtDay(ve.end)}` : `En cours depuis le ${fmtDay(ve.start)}`} · ${n} coffret${n>1?'s':''}${bad ? ` · <b style="color:var(--bad)">${bad} batterie${bad>1?'s':''} à remplacer</b>` : ''}</div>
    </div><div style="font-size:22px;color:var(--muted)">›</div></div>
    ${!ve.closed && n ? `<div class="prog"><div style="width:${Math.round(d/n*100)}%"></div></div><div class="sub">${d}/${n} coffret${n>1?'s':''} relevé${d>1?'s':''}</div>` : ''}
  </div>`;
}
function renderVes(){
  const open = S.ves.filter(v => !v.closed).sort((a,b) => b.start - a.start);
  const closed = S.ves.filter(v => v.closed).sort((a,b) => (b.end||b.start) - (a.end||a.start));
  const alerts = allBatteries().filter(x => x.st === 'bad').length;
  $('view').innerHTML = `
    ${!storageOK ? `<div class="alertbar bad">⛔ Les données ne sont pas enregistrées sur ce navigateur. Ouvre l'appli avec Chrome.</div>` : ''}
    ${alerts ? `<div class="alertbar bad tap" onclick="go('bats')">⚠️ <div class="grow"><b>${alerts} batterie${alerts>1?'s':''}</b> de plus de ${S.settings.ageYears} ans à remplacer</div>›</div>` : ''}
    <h2>VE en cours</h2>
    ${open.length ? open.map(veCard).join('') : `<div class="card empty">Aucune VE en cours.<br><button class="btn primary block" onclick="newVe()">+ Démarrer une VE</button>
      ${!hasData() ? `<button class="btn block" onclick="pickBackup()">☁️ J'ai déjà une sauvegarde sur OneDrive</button>` : ''}</div>`}
    ${closed.length ? `<h2>Historique</h2>${closed.slice(0, 40).map(veCard).join('')}` : ''}`;
}

/* ============ Sites (menu central) ============ */
let siteQ = '';
function siteInfo(site){
  const ves = S.ves.filter(v => v.siteId === site.id).sort((a, b) => b.start - a.start), last = ves[0];
  const cof = last ? last.coffrets : [], bats = cof.flatMap(c => c.bats);
  return {ves, last, open: ves.filter(v => !v.closed).length, nA: cof.filter(c => c.type !== 'ca').length, nC: cof.filter(c => c.type === 'ca').length,
    bad: bats.filter(b => batStatus(b) === 'bad').length, warn: bats.filter(b => batStatus(b) === 'warn').length};
}
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function siteCard(site){
  const i = siteInfo(site);
  return `<div class="card tap" onclick="go('site','${site.id}')">
    <div class="row"><div class="grow">
      <div class="name">🏢 ${esc(site.name)}${site.idSite ? ` <span class="pill info">ID ${esc(site.idSite)}</span>` : ''}</div>
      ${site.client || site.addr ? `<div class="sub">${esc([site.client, site.addr].filter(Boolean).join(' · '))}</div>` : ''}
      <div class="sub">${i.ves.length} VE${i.last ? ` · dernière le ${fmtDay(i.last.start)}` : ''}${i.nA ? ` · 🚨 ${i.nA}` : ''}${i.nC ? ` · 🚪 ${i.nC}` : ''}</div>
      <div>${i.open ? '<span class="pill ok">🟢 VE en cours</span>' : ''}${i.bad ? `<span class="pill bad">⚠️ ${i.bad} batterie${i.bad > 1 ? 's' : ''} à remplacer</span>` : ''}${i.warn ? `<span class="pill warn">⏳ ${i.warn} à prévoir</span>` : ''}</div>
    </div><div style="font-size:22px;color:var(--muted)">›</div></div></div>`;
}
function renderSites(){
  const q = norm(siteQ);
  const list = S.sites.filter(x => !q || norm([x.name, x.idSite, x.client, x.addr, x.contact].join(' ')).includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, 'fr', {numeric: true, sensitivity: 'base'}));
  $('view').innerHTML = `
    <input id="siteSearch" type="search" placeholder="🔎 Rechercher un site, un ID, un client, une ville…" value="${esc(siteQ)}" oninput="siteQ=this.value;renderSitesList()" style="margin:4px 0 10px">
    <div id="sitesList">${sitesListHtml(list)}</div>`;
}
function sitesListHtml(list){
  if (!S.sites.length) return `<div class="card empty">Aucun site pour l'instant.<br>Ils se créent tout seuls quand tu démarres une VE, ou avec le bouton +.<br><button class="btn primary block" onclick="editSite()">+ Ajouter un site</button></div>`;
  return `<div class="sub" style="margin:0 2px 6px">${list.length} site${list.length > 1 ? 's' : ''}</div>` + (list.map(siteCard).join('') || '<div class="card empty">Aucun site ne correspond.</div>');
}
function renderSitesList(){
  const q = norm(siteQ);
  $('sitesList').innerHTML = sitesListHtml(S.sites.filter(x => !q || norm([x.name, x.idSite, x.client, x.addr, x.contact].join(' ')).includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'fr', {numeric: true, sensitivity: 'base'})));
}
function renderSite(site){
  const i = siteInfo(site), last = i.last;
  const fiches = v => ['08', '11'].filter(t => ficheOf(v.id, t)).map(t => `<span class="pill info">📝 ${VCE[t].short}</span>`).join('');
  $('view').innerHTML = `
    <div class="card">
      <div class="row"><div class="grow">
        <div class="name" style="font-size:18px">🏢 ${esc(site.name)}</div>
        ${site.idSite ? `<div class="sub">ID site : <b>${esc(site.idSite)}</b></div>` : ''}
        ${site.client ? `<div class="sub">Client : ${esc(site.client)}</div>` : ''}
        ${site.addr ? `<div class="sub">📍 ${esc(site.addr)}</div>` : ''}
        ${site.contact ? `<div class="sub">👤 ${esc(site.contact)}</div>` : ''}
        ${site.note ? `<div class="sub">📝 ${esc(site.note)}</div>` : ''}
      </div><button class="btn small" onclick="editSite('${site.id}')">✏️ Modifier</button></div>
      ${site.addr ? `<a class="btn block" style="display:block;text-align:center;text-decoration:none;margin-top:10px;box-sizing:border-box" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(site.addr)}" target="_blank" rel="noopener">🧭 Itinéraire</a>` : ''}
      <button class="btn primary block" onclick="newVe(${esc(JSON.stringify(site.name))})">+ Nouvelle VE sur ce site</button>
    </div>
    ${last ? `<div class="card">
      <div class="name">🔋 Installation (dernière VE du ${fmtDay(last.start)})</div>
      <div class="sub">${last.coffrets.length} coffret${last.coffrets.length > 1 ? 's' : ''}${i.nA ? ` · 🚨 ${i.nA} alarme` : ''}${i.nC ? ` · 🚪 ${i.nC} contrôle d'accès` : ''}</div>
      ${last.coffrets.map(c => `<div class="row" style="border-top:1px solid var(--line);padding:7px 0;align-items:flex-start"><div style="width:22px">${typeIcon(c.type)}</div><div class="grow"><div style="font-size:14px;font-weight:600">${esc(c.label || 'Coffret')}${c.loc ? ` <span class="sub">· ${esc(c.loc)}</span>` : ''}</div><div>${c.bats.map(batPill).join('') || '<span class="pill info">aucune batterie</span>'}</div></div></div>`).join('')}
    </div>` : ''}
    <h2>VE de ce site (${i.ves.length})</h2>
    ${i.ves.map(v => {
      const {n, d} = veProgress(v), rep = v.coffrets.reduce((s, c) => s + c.bats.filter(b => b.replaced).length, 0);
      return `<div class="card tap" onclick="veMode='bat';go('ve','${v.id}')">
        <div class="row"><div class="grow">
          <div class="name">${v.closed ? '✅' : '🟢'} ${v.closed ? `VE du ${fmtDay(v.start)} au ${fmtDay(v.end)}` : `VE en cours depuis le ${fmtDay(v.start)}`}</div>
          <div class="sub">${d}/${n} coffret${n > 1 ? 's' : ''} relevé${d > 1 ? 's' : ''}${rep ? ` · 🔁 ${rep} batterie${rep > 1 ? 's' : ''} remplacée${rep > 1 ? 's' : ''}` : ''}</div>
          <div>${fiches(v)}</div>
        </div><div style="font-size:22px;color:var(--muted)">›</div></div></div>`;
    }).join('') || '<div class="card empty">Aucune VE sur ce site pour l\'instant.</div>'}
    <button class="btn block" style="color:var(--bad);margin-top:14px" onclick="deleteSite('${site.id}')">🗑 Supprimer ce site</button>`;
}
function editSite(id){
  const site = id ? S.sites.find(x => x.id === id) : {};
  const f = (k, l, ph, extra) => `<label>${l}</label><input id="es_${k}" value="${esc(site[k] || '')}" placeholder="${ph}" ${extra || ''}>`;
  openSheet(`<h3>${id ? '✏️ Modifier le site' : '🏢 Nouveau site'}</h3>
    ${f('name', 'Nom du site', 'ex. Résidence Les Tilleuls')}
    <div class="grid2"><div>${f('idSite', 'ID site', 'ex. S-0098')}</div><div>${f('client', 'Client', 'ex. AS24')}</div></div>
    ${f('addr', 'Adresse', 'ex. 12 rue des Lilas, Loudéac')}
    ${f('contact', 'Contact sur place', 'ex. M. Durand · 06…')}
    <label>Note</label><textarea id="es_note" placeholder="Accès, horaires, parking…">${esc(site.note || '')}</textarea>
    <div class="hint">🔒 Ne note pas de codes d'accès, codes installateur ou digicodes ici.</div>
    <button class="btn primary block" onclick="saveSite(${id ? `'${id}'` : ''})">Enregistrer</button>
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
  if (!id) setTimeout(() => $('es_name') && $('es_name').focus(), 60);
}
function saveSite(id){
  const v = k => $('es_' + k).value.trim(), name = v('name');
  if (!name) return toast('Indique le nom du site');
  const dup = S.sites.find(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase());
  if (dup) return toast('Un site porte déjà ce nom');
  let site = id && S.sites.find(x => x.id === id);
  if (!site) { site = {id: uid()}; S.sites.push(site); }
  ['name', 'idSite', 'client', 'addr', 'contact', 'note'].forEach(k => { const x = v(k); if (x) site[k] = x; else if (k !== 'name') delete site[k]; });
  site.name = name; save(); closeSheet(); go('site', site.id); toast(id ? 'Site enregistré' : 'Site créé');
}
function deleteSite(id){
  const n = S.ves.filter(v => v.siteId === id).length;
  if (!confirm(n ? `Supprimer ce site et ses ${n} VE (mesures comprises) ?` : 'Supprimer ce site ?')) return;
  snapshot(); // les fiches VCE liées restent en mémoire : « Annuler » restaure tout
  S.sites = S.sites.filter(x => x.id !== id); S.ves = S.ves.filter(v => v.siteId !== id); save(); go('sites'); offerUndo('Site supprimé');
}

/* ============ Nouvelle VE ============ */
function newVe(preset){
  openSheet(`<h3>Nouvelle VE</h3>
    <label>Site</label>
    <input id="nvSite" list="siteList" placeholder="ex. Résidence Les Tilleuls" autocomplete="off" value="${esc(preset || '')}">
    <datalist id="siteList">${S.sites.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(s => `<option value="${esc(s.name)}">`).join('')}</datalist>
    <div class="hint">Si le site existe déjà, ses coffrets et batteries sont repris automatiquement : il ne reste qu'à saisir les mesures.</div>
    <label>Date de début</label>
    <input id="nvDate" type="date" value="${dayInput(Date.now())}">
    <button class="btn primary block" onclick="createVe()">Démarrer la VE</button>
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
  if (!preset) setTimeout(() => $('nvSite') && $('nvSite').focus(), 60);
}
function createVe(){
  const name = $('nvSite').value.trim(); if (!name) return toast('Indique le nom du site');
  let site = S.sites.find(s => s.name.toLowerCase() === name.toLowerCase());
  if (!site) { site = {id: uid(), name}; S.sites.push(site); }
  const start = $('nvDate').value ? new Date($('nvDate').value + 'T08:00').getTime() : Date.now();
  // Reprise de la dernière VE du site
  const prev = S.ves.filter(v => v.siteId === site.id).sort((a,b) => b.start - a.start)[0];
  const coffrets = prev ? prev.coffrets.map(c => ({id: uid(), label: c.label, loc: c.loc, type: c.type,
    bats: c.bats.map(b => ({id: uid(), cap: b.cap, pose: b.pose, replaced: false})), vOn: '', vOff: '', vFin: '', conso: '', unit: c.unit || 'mA', note: ''})) : [];
  const ve = {id: uid(), siteId: site.id, start, end: null, closed: false, coffrets, carnet: '', carnetEdited: false};
  S.ves.push(ve); save(); closeSheet(); veMode = 'bat'; go('ve', ve.id);
  toast(prev ? `${coffrets.length} coffret${coffrets.length>1?'s':''} repris de la VE du ${fmtDay(prev.start)}` : 'VE démarrée : ajoute tes coffrets avec +');
}

/* ============ Détail d'une VE ============ */
function coffretCard(ve, c, i){
  const done = coffretDone(c);
  return `<div class="card tap" onclick="editCoffret('${c.id}')">
    <div class="row"><div class="grow">
      <div class="name">${typeIcon(c.type)} ${esc(c.label || 'Coffret ' + (i+1))} ${done ? '<span class="pill ok">relevé ✓</span>' : '<span class="pill warn">à relever</span>'}</div>
      <div class="sub">${typeLabel(c.type)}${c.loc ? ' · ' + esc(c.loc) : ''}</div>
      ${done ? '' : `<div class="sub" style="color:var(--warn);font-weight:600">Manque : ${coffretMissing(c).join(', ')}</div>`}
    </div><div style="font-size:22px;color:var(--muted)">›</div></div>
    <div>${c.bats.length ? c.bats.map(b => batPill(b) + (b.replaced ? '<span class="pill info">🔁 remplacée</span>' : '')).join('') : '<span class="pill info">aucune batterie</span>'}</div>
    ${done || c.vOn || c.vOff || c.conso ? `<div class="meas"><span>⚡ ${fmtNum(c.vOn) || '–'} V</span><span>🔌 ${fmtNum(c.vOff) || '–'} V</span>${num(c.vFin) !== null ? `<span>🏁 ${fmtNum(c.vFin)} V</span>` : ''}<span>➰ ${fmtNum(c.conso) || '–'} ${c.unit}</span></div>` : ''}
    ${c.note ? `<div class="sub">📝 ${esc(c.note)}</div>` : ''}
  </div>`;
}
function renderVe(ve){
  const {n, d} = veProgress(ve);
  const seg = `<div class="seg"><button class="${veMode === 'bat' ? 'on' : ''}" onclick="veMode='bat';render()">🔋 Batteries</button><button class="${veMode === 'vce' ? 'on' : ''}" onclick="veMode='vce';render()">📝 Fiche VCE</button></div>`;
  if (veMode === 'vce') { $('view').innerHTML = seg + vceTabHtml(ve); return; }
  $('view').innerHTML = seg + `
    <div class="card">
      <div class="sub">${ve.closed ? `✅ Clôturée · du ${fmtDay(ve.start)} au ${fmtDay(ve.end)}` : `🟢 En cours depuis le ${fmtDay(ve.start)}`}</div>
      ${n ? `<div class="prog"><div style="width:${Math.round(d/n*100)}%"></div></div><div class="sub">${d}/${n} coffret${n>1?'s':''} relevé${d>1?'s':''}</div>` : ''}
      <div class="grid2" style="margin-top:6px">
        <button class="btn" onclick="showRecap('${ve.id}')">📋 Récap</button>
        <button class="btn" onclick="showCarnet('${ve.id}')">📒 Carnet</button>
      </div>
      <button class="btn primary block" onclick="makePdf('${ve.id}')">📄 Rapport PDF</button>
    </div>
    <h2>Coffrets</h2>
    ${n ? ve.coffrets.map((c, i) => coffretCard(ve, c, i)).join('') : '<div class="card empty">Aucun coffret.<br>Appuie sur <b>+</b> pour ajouter le premier.</div>'}
    <button class="btn block" onclick="addCoffret()">+ Ajouter un coffret</button>
    ${ve.closed ? `<button class="btn block" onclick="reopenVe('${ve.id}')">↩️ Rouvrir la VE</button>`
                : `<button class="btn ok block" onclick="closeVe('${ve.id}')">✅ Clôturer la VE</button>`}
    <button class="btn block" onclick="editVe('${ve.id}')">✏️ Site et dates</button>
    <button class="btn block" style="color:var(--bad)" onclick="deleteVe('${ve.id}')">🗑 Supprimer la VE</button>`;
}
function editVe(id){
  const ve = S.ves.find(v => v.id === id);
  openSheet(`<h3>Site et dates</h3>
    <label>Nom du site</label><input id="evName" value="${esc(siteName(ve.siteId))}">
    <div class="grid2">
      <div><label>Début</label><input id="evStart" type="date" value="${dayInput(ve.start)}"></div>
      <div><label>Fin</label><input id="evEnd" type="date" value="${ve.end ? dayInput(ve.end) : ''}"></div>
    </div>
    <div class="hint">Renommer le site le renomme aussi dans les autres VE de ce site.</div>
    <button class="btn primary block" onclick="saveVeEdit('${id}')">Enregistrer</button>
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
}
function saveVeEdit(id){
  const ve = S.ves.find(v => v.id === id), name = $('evName').value.trim();
  if (name) S.sites.find(s => s.id === ve.siteId).name = name;
  if ($('evStart').value) ve.start = new Date($('evStart').value + 'T08:00').getTime();
  ve.end = $('evEnd').value ? new Date($('evEnd').value + 'T18:00').getTime() : (ve.closed ? ve.end : null);
  save(); closeSheet(); render();
}
function closeVe(id){
  const ve = S.ves.find(v => v.id === id); const {n, d} = veProgress(ve);
  if (d < n && !confirm(`${n - d} coffret${n-d>1?'s':''} sans mesures complètes. Clôturer quand même ?`)) return;
  snapshot(); ve.closed = true; ve.end = ve.end || Date.now(); save(); render();
  offerUndo('VE clôturée'); showCarnet(id);
}
function reopenVe(id){ const ve = S.ves.find(v => v.id === id); snapshot(); ve.closed = false; save(); render(); offerUndo('VE rouverte'); }
function deleteVe(id){
  if (!confirm('Supprimer cette VE et toutes ses mesures ?')) return;
  const sid = (S.ves.find(v => v.id === id) || {}).siteId;
  snapshot(); S.ves = S.ves.filter(v => v.id !== id); save(); fromSite ? go('site', sid) : go('ves'); offerUndo('VE supprimée');
}

/* ============ Coffret ============ */
let curC = null;
const getC = () => { const ve = S.ves.find(v => v.id === curVe); return ve && ve.coffrets.find(c => c.id === curC); };

  const ve = S.ves.find(v => v.id === curVe); if (!ve) return;
  const c = {id: uid(), label: '', loc: '', type: 'alarme', bats: [{id: uid(), cap: null, pose: '', replaced: false}], vOn: '', vOff: '', vFin: '', conso: '', unit: 'mA', note: ''};
  ve.coffrets.push(c); save(); render(); editCoffret(c.id, true);
}

    <label style="margin-top:14px">Batteries 12 V</label>

      <div><label style="margin-top:0">Hors tension (V)</label><input inputmode="decimal" value="${esc(fmtNum(c.vOff))}" placeholder="ex. 12,7" oninput="setC('vOff', this.value)"></div>

function batEditor(b, i){

function setC(k, v){ const c = getC(); if (!c) return; c[k] = v; save(); }
// Rafraîchit la liste des batteries juste après l'événement en cours (évite les conflits quand on quitte une case)
let batRefresh = null;
function refreshBats(){
  clearTimeout(batRefresh);
  batRefresh = setTimeout(() => { const c = getC(); if (c && $('batList')) $('batList').innerHTML = c.bats.map((b, i) => batEditor(b, i)).join(''); }, 0);

function setBat(id, k, v){ const b = getC().bats.find(x => x.id === id); b[k] = v; save(); refreshBats(); }
function setCustomCap(id, v){
  const n = num(v);
  if (n === null) { if (String(v).trim()) { toast('Capacité invalide'); refreshBats(); } else setBat(id, 'cap', null); return; }
  if (n <= 0 || n > 500) { toast('Capacité invalide (entre 0 et 500 Ah)'); refreshBats(); return; }
  setBat(id, 'cap', Math.round(n * 10) / 10);
}
function addBat(){ const c = getC(); const last = c.bats[c.bats.length - 1]; c.bats.push({id: uid(), cap: null, pose: '', replaced: false}); save(); refreshBats(); }
function delBat(id){ const c = getC(); snapshot(); c.bats = c.bats.filter(b => b.id !== id); save(); refreshBats(); offerUndo('Batterie supprimée'); }
function replaceBat(id){
  const b = getC().bats.find(x => x.id === id);
  b.oldPose = b.pose; b.pose = thisMonth(); b.replaced = true; save(); refreshBats();
  toast(`🔁 Batterie remplacée : date de pose ${fmtPose(b.pose)}`);
}
function undoReplace(id){ const b = getC().bats.find(x => x.id === id); b.pose = b.oldPose || ''; b.replaced = false; delete b.oldPose; save(); refreshBats(); }
function deleteCoffret(){

  if (!confirm(`Supprimer le coffret « ${c.label || 'sans nom'} » ?`)) return;

function batLine(b){
  const st = batStatus(b);
  return `12V ${fmtCap(b.cap)}Ah posée ${fmtPose(b.pose)}` + (b.replaced ? ` (remplacée${b.oldPose ? ', ancienne posée ' + fmtPose(b.oldPose) : ''})` : (b.pose ? ` (${ageText(ageMonths(b.pose))}${st === 'bad' ? ' – à remplacer' : st === 'warn' ? ' – à prévoir' : ''})` : ''));

function coffretText(c, i){
  return `[${i+1}] ${c.label || 'Coffret ' + (i+1)} – ${typeLabel(c.type)}${c.loc ? ' – ' + c.loc : ''}\n`
    + `Batterie${c.bats.length>1?'s':''} : ${c.bats.length ? c.bats.map(batLine).join(' + ') : 'aucune'}\n`
    + `Sous tension : ${fmtNum(c.vOn) || '–'} V | Hors tension : ${fmtNum(c.vOff) || '–'} V${num(c.vFin) !== null ? ` | Bat. fin : ${fmtNum(c.vFin)} V` : ''} | Conso : ${fmtNum(c.conso) || '–'} ${c.unit}`

async function copyText(t, msg){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }

}

    ${ve.coffrets.map((c, i) => `<div class="card" style="margin-top:10px">
      <div class="preview" style="max-height:none">${esc(coffretText(c, i))}</div>
      <button class="btn small block" onclick="copyText(coffretText(recapVe.coffrets[${i}],${i}),'📋 Coffret ${i+1} copié')">📋 Copier ce coffret</button>
    </div>`).join('') || '<div class="empty">Aucun coffret dans cette VE.</div>'}
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
}
function carnetAuto(ve){
  // Version courte (2 lignes max) : le détail est dans le récap et le rapport PDF
  const n = ve.coffrets.length;
  const d1 = new Date(ve.start), d2 = ve.end ? new Date(ve.end) : null;
  const dd = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  const period = d2 && fmtDay(ve.end) !== fmtDay(ve.start) ? `${dd(d1)} au ${fmtDay(ve.end)}` : fmtDay(ve.start);
  const repl = [], todo = [];
  ve.coffrets.forEach(c => c.bats.forEach(b => {
    if (b.replaced) repl.push(c.label || 'coffret');
    else if (batStatus(b) === 'bad') todo.push(c.label || 'coffret');
  }));
  const list = (arr, one, many) => arr.length === 1 ? `${one} : ${arr[0]}.` : arr.length === 2 ? `${many} : ${arr.join(', ')}.` : `${arr.length} ${many.toLowerCase()}.`;
  let t = `VE du ${period} : ${n} coffret${n>1?'s':''} contrôlé${n>1?'s':''}, tensions et conso relevées.`;
  if (repl.length) t += ' ' + list(repl, 'Batterie remplacée', 'Batteries remplacées');
  if (todo.length) t += ' ' + list(todo, 'Batterie à remplacer', 'Batteries à remplacer');
  if (!repl.length && !todo.length) t += ' Batteries OK.';
  return t;
}

/* ============ Rapport PDF ============ */
const TEAL = [15, 76, 92], STATE_COL = {bad: [214, 69, 69], warn: [217, 138, 0], ok: [31, 157, 85], unknown: [102, 118, 132], repl: [27, 111, 133]};
const pdfSafe = t => String(t ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...')
  .replace(/[^\x20-\x7E -ÿ–—€\n]/g, '');   // jsPDF (polices standard) : alphabet latin uniquement
function pdfName(ve){
  const site = siteName(ve.siteId).replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 50);
  const d = new Date(ve.end || ve.start);
  return `Rapport VE - ${site} - ${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}.pdf`;
}
function buildPdf(ve){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const W = 210, M = 14, CW = W - 2 * M;
  const bats = ve.coffrets.flatMap(c => c.bats.map(b => ({c, b, st: b.replaced ? 'repl' : batStatus(b)})));
  const nBad = bats.filter(x => x.st === 'bad').length, nRepl = bats.filter(x => x.st === 'repl').length, nWarn = bats.filter(x => x.st === 'warn').length;

  // En-tête
  doc.setFillColor(...TEAL); doc.rect(0, 0, W, 28, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
  doc.text(pdfSafe("Rapport de visite d'entretien"), M, 12);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(pdfSafe("Relevé des batteries – coffrets d'alarme et de contrôle d'accès"), M, 19.5);
  doc.setFontSize(9); doc.text(pdfSafe(ve.closed ? 'VE clôturée' : 'VE en cours'), W - M, 12, {align: 'right'});

  // Informations
  let y = 38;
  const info = [['Site', siteName(ve.siteId)],
    ['Période', `du ${fmtDay(ve.start)}${ve.end ? ' au ' + fmtDay(ve.end) : ' (en cours)'}`],
    ['Technicien', S.settings.tech || '—']];
  info.forEach(([k, v]) => {
    doc.setTextColor(102, 118, 132); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text(pdfSafe(k), M, y);
    doc.setTextColor(22, 33, 42); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(pdfSafe(v), M + 26, y);
    y += 6.5;
  });

  // Résumé (4 cases)
  y += 2;
  const boxes = [['Coffrets', ve.coffrets.length, TEAL], ['Batteries', bats.length, TEAL],
    ['À remplacer', nBad, nBad ? STATE_COL.bad : STATE_COL.ok], ['Remplacées', nRepl, STATE_COL.repl]];
  const bw = (CW - 3 * 4) / 4;
  boxes.forEach(([lab, val, col], i) => {
    const x = M + i * (bw + 4);
    doc.setDrawColor(...col); doc.setLineWidth(0.5); doc.roundedRect(x, y, bw, 17, 2, 2, 'S');
    doc.setTextColor(...col); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(String(val), x + bw / 2, y + 8.5, {align: 'center'});
    doc.setFontSize(8.5); doc.setFont('helvetica', 'normal'); doc.text(pdfSafe(lab), x + bw / 2, y + 14, {align: 'center'});
  });
  y += 25;

  const section = (title) => {
    if (y > 260) { doc.addPage(); y = 20; }
    doc.setTextColor(...TEAL); doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.text(pdfSafe(title), M, y);
    doc.setDrawColor(...TEAL); doc.setLineWidth(0.4); doc.line(M, y + 1.8, W - M, y + 1.8); y += 6;
  };
  const table = (head, body, opts) => {
    doc.autoTable(Object.assign({startY: y, head: [head.map(pdfSafe)], body: body.map(r => r.map(c => pdfSafe(c))), margin: {left: M, right: M},
      theme: 'grid', styles: {font: 'helvetica', fontSize: 8.8, cellPadding: 1.8, textColor: [22, 33, 42], lineColor: [210, 218, 223], lineWidth: 0.2},
      headStyles: {fillColor: TEAL, textColor: 255, fontStyle: 'bold', halign: 'center'},
      alternateRowStyles: {fillColor: [243, 247, 248]}}, opts || {}));
    y = doc.lastAutoTable.finalY + 9;
  };

  // 1. Mesures
  section('1. Mesures par coffret');
  if (ve.coffrets.length) table(['#', 'Coffret', 'Type', 'Localisation', 'Sous tension', 'Hors tension', 'Consommation'],
    ve.coffrets.map((c, i) => [i + 1, c.label || 'Coffret ' + (i + 1), typeLabel(c.type), c.loc || '—',
      num(c.vOn) !== null ? fmtNum(c.vOn) + ' V' : '—', num(c.vOff) !== null ? fmtNum(c.vOff) + ' V' : '—',
      num(c.conso) !== null ? fmtNum(c.conso) + ' ' + c.unit : '—']),
    {columnStyles: {0: {halign: 'center', cellWidth: 8}, 4: {halign: 'center'}, 5: {halign: 'center'}, 6: {halign: 'center'}}});
  else { doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(102, 118, 132); doc.text('Aucun coffret.', M, y); y += 9; }

  // 2. Batteries
  section('2. État des batteries 12 V');
  const stLabel = {bad: 'À remplacer', warn: 'À prévoir', ok: 'OK', unknown: 'Date inconnue', repl: 'Remplacée'};
  if (bats.length) table(['Coffret', 'Capacité', 'Date de pose', 'Âge', 'État'],
    bats.map(x => [x.c.label || 'Coffret', fmtCap(x.b.cap) + ' Ah', fmtPose(x.b.pose) + (x.b.replaced && x.b.oldPose ? ` (ancienne : ${fmtPose(x.b.oldPose)})` : ''),
      x.b.pose ? ageText(ageMonths(x.b.pose)) : '—', stLabel[x.st]]),
    {columnStyles: {1: {halign: 'center'}, 2: {halign: 'center'}, 3: {halign: 'center'}, 4: {halign: 'center', fontStyle: 'bold'}},
     didParseCell: d => { if (d.section === 'body' && d.column.index === 4) d.cell.styles.textColor = STATE_COL[bats[d.row.index].st]; }});
  doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(102, 118, 132);
  doc.text(pdfSafe(`Remplacement conseillé tous les ${S.settings.ageYears} ans.${nWarn ? ` ${nWarn} batterie${nWarn>1?'s':''} à prévoir dans les ${S.settings.warnMonths} prochains mois.` : ''}`), M, y - 5);
  y += 1;

  // 3. Remarques
  const notes = ve.coffrets.filter(c => c.note);
  if (notes.length) { section('3. Remarques'); table(['Coffret', 'Remarque'], notes.map(c => [c.label || 'Coffret', c.note]), {columnStyles: {0: {cellWidth: 50, fontStyle: 'bold'}}}); }

  // 4. Carnet de maintenance
  section(`${notes.length ? 4 : 3}. Carnet de maintenance`);
  const carnet = pdfSafe(ve.carnetEdited && ve.carnet ? ve.carnet : carnetAuto(ve));
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(22, 33, 42);
  const lines = doc.splitTextToSize(carnet, CW - 8), h = lines.length * 4.6 + 7;
  if (y + h > 280) { doc.addPage(); y = 20; }
  doc.setFillColor(243, 247, 248); doc.setDrawColor(210, 218, 223); doc.roundedRect(M, y - 2, CW, h, 2, 2, 'FD');
  doc.text(lines, M + 4, y + 3.5); y += h + 6;

  // Pied de page
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setDrawColor(210, 218, 223); doc.setLineWidth(0.2); doc.line(M, 286, W - M, 286);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(102, 118, 132);
    doc.text(pdfSafe(`${siteName(ve.siteId)} – généré le ${new Date().toLocaleString('fr-FR')}`), M, 291);
    doc.text(`Page ${i} / ${n}`, W - M, 291, {align: 'right'});
  }
  return doc;
}
let lastPdf = null;
function makePdf(id){
  const ve = S.ves.find(v => v.id === id); if (!ve) return;
  if (!window.jspdf) return toast('Module PDF indisponible : recharge l\'appli avec du réseau');
  let blob;
  try { blob = buildPdf(ve).output('blob'); } catch(e) { return toast('Erreur PDF : ' + e.message); }
  const name = pdfName(ve);
  lastPdf = {blob, name};
  openSheet(`<h3>📄 Rapport PDF prêt</h3>
    <div class="sub">${esc(name)}</div>
    <button class="btn primary block" onclick="sharePdf()">📤 Partager (mail, WhatsApp, Drive…)</button>
    <button class="btn block" onclick="download(lastPdf.name, lastPdf.blob, 'application/pdf')">⬇️ Télécharger sur le téléphone</button>
    <button class="btn block" onclick="window.open(URL.createObjectURL(lastPdf.blob), '_blank')">👁️ Voir le rapport</button>
    <div class="hint" id="pdfOd">${odReady() ? '☁️ Envoi d\'une copie sur OneDrive › Rapports…' : 'Connecte OneDrive dans les Réglages pour garder automatiquement une copie de chaque rapport.'}</div>
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
  if (odReady()) odSavePdf(blob, name);
}
async function sharePdf(){
  if (!lastPdf) return;
  const file = new File([lastPdf.blob], lastPdf.name, {type: 'application/pdf'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) return await navigator.share({files: [file], title: lastPdf.name});
  } catch(e) { if (e.name === 'AbortError') return; }
  download(lastPdf.name, lastPdf.blob, 'application/pdf'); toast('Partage indisponible : rapport téléchargé');
}
async function odSavePdf(blob, name){
  try {
    const token = await odToken();
    await odPut(token, 'Rapports/' + name, blob, 'application/pdf');
    if ($('pdfOd')) $('pdfOd').textContent = '☁️ Copie enregistrée sur OneDrive › Applications › BATTERIES VE › Rapports';
  } catch(e) { if ($('pdfOd')) $('pdfOd').textContent = '☁️ Copie OneDrive impossible pour l\'instant : ' + odErrText(e); }
}

let curType = '08', veMode = 'bat', openSec = new Set(['inter']);
const ficheOf = (veId, type) => (FICHES[veId] || {})[type];
function getFiche(ve, type, create){
  let f = ficheOf(ve.id, type);
  if (!f && create) {
    const st = S.sites.find(x => x.id === ve.siteId) || {};
    f = {v: {date: dayInput(ve.end || Date.now()), type: 'VE', client: st.client || siteName(ve.siteId), site: st.idSite || undefined, nomTech: S.settings.tech || ''}, alims: VCE[type].fixed.map(l => ({id: uid(), fixed: l})), lecteurs: [], unlinked: [], upd: Date.now()};
    if (mySig()) f.v.sig_tech = mySig();
    const other = ficheOf(ve.id, otherType(type));
    if (other) SHARED.forEach(k => { if (other.v[k] !== undefined) f.v[k] = other.v[k]; });
    (FICHES[ve.id] = FICHES[ve.id] || {})[type] = f; saveFiches();
  }
  return f;
}
const curFiche = () => { const ve = S.ves.find(v => v.id === curVe); return ve && getFiche(ve, curType, true); };
// Infos communes aux deux fiches : remplies sur l'une, recopiées aussitôt sur l'autre (les observations restent séparées)
const SHARED = new Set(['date', 'inter', 'site', 'client', 'type', 'modif', 'interv', 'pbexp', 'disp', 'pose', 'cabl', 'heure', 'cohPrev', 'cohCalc', 'f230', 'livret', 'nomClient', 'fctClient', 'nomTech', 'sig_client', 'sig_tech']);
const otherType = t => t === '08' ? '11' : '08';
const setV = (f, k, v) => { if (v === '' || v === null || v === false || v === undefined) delete f.v[k]; else f.v[k] = v; f.upd = Date.now(); };
function fset(k, v){
  const f = curFiche(); if (!f) return; setV(f, k, v);

  saveFiches();
}
function syncShared(){ const f = curFiche(), o = ficheOf(curVe, otherType(curType)); if (f && o) SHARED.forEach(k => setV(o, k, f.v[k])); }
function ftoggle(k){ const f = curFiche(); fset(k, !f.v[k]); rerenderFiche(); }

// --- Lien avec les coffrets de la partie Batteries ---
const mA = c => { const n = num(c.conso); return n === null ? '' : fmtNum(Math.round((c.unit === 'A' ? n * 1000 : n) * 100) / 100); };
function coffretVals(c){ return {loc: [c.label, c.loc].filter(Boolean).join(' – '), ch: fmtNum(num(c.vOn) ?? ''), deb: fmtNum(num(c.vOff) ?? ''), fin: fmtNum(num(c.vFin) ?? ''), conso: mA(c)}; }
function rowVals(r, ve){
  const c = r.cid && ve.coffrets.find(x => x.id === r.cid);
  if (!c) return {loc: r.fixed || r.loc || '', ref: r.ref || '', ch: r.ch || '', deb: r.deb || '', fin: r.fin || '', conso: r.conso || '', linked: false};
  const v = coffretVals(c);
  Object.assign(r, {ch: v.ch, deb: v.deb, fin: v.fin, conso: v.conso}); // copie de secours si le coffret est supprimé
  return Object.assign(v, {loc: r.fixed || v.loc, ref: r.ref || '', linked: true, c});
}
function linkCoffrets(f, ve, type){
  const D = VCE[type], linked = new Set(f.alims.map(r => r.cid).filter(Boolean));
  const todo = ve.coffrets.filter(c => c.type === D.ctype && !linked.has(c.id) && !(f.unlinked || []).includes(c.id));
  if (!todo.length) { sortAlims(f, ve); return false; }
  const free = i => f.alims[i] && f.alims[i].fixed && !f.alims[i].cid && !f.alims[i].ch && !f.alims[i].deb;
  if (D.fixed.length) {
    const pats = [/centrale/i, /princ/i, /secours/i];
    pats.forEach((p, i) => { const c = todo.find(c => p.test(c.label + ' ' + c.loc)); if (c && free(i)) { f.alims[i].cid = c.id; todo.splice(todo.indexOf(c), 1); } });
    if (todo.length && free(0) && !ve.coffrets.some(c => /centrale/i.test(c.label + ' ' + c.loc))) f.alims[0].cid = todo.shift().id;
  }
  todo.forEach(c => f.alims.push({id: uid(), cid: c.id}));
  sortAlims(f, ve);
  saveFiches(); return true;
}
// Lignes libres du tableau Alimentations rangées par ordre alphabétique (les lignes pré-imprimées restent en tête)
function sortAlims(f, ve){
  const fixed = f.alims.filter(r => r.fixed), rest = f.alims.filter(r => !r.fixed);
  rest.sort((a, b) => cmpTxt(rowVals(a, ve).loc || '\uffff', rowVals(b, ve).loc || '\uffff'));
  f.alims = [...fixed, ...rest];
}

  if (r.cid) (f.unlinked = f.unlinked || []).push(r.cid);
  if (r.fixed) { delete r.cid; ['ch', 'deb', 'fin', 'conso', 'ref'].forEach(k => delete r[k]); }
  else f.alims = f.alims.filter(x => x.id !== id);

}

  const f = curFiche(), ve = S.ves.find(v => v.id === curVe), r = f.alims.find(x => x.id === id), v = rowVals(r, ve);

function alimLink(id, cid){
  if (!cid) return; const f = curFiche(), r = f.alims.find(x => x.id === id);

function secCount(s, f){

    if (it.t === 'sigs') { n += ['client', 'tech'].filter(w => f.v['sig_' + w]).length; return; }

  s.items.forEach(walk); return n;
}

      <button class="btn small" data-a="land">↻ Paysage</button>

    <div class="sigarea"><canvas></canvas><div class="sigline"></div><div class="sighint">Signe ici · tourne le téléphone pour signer en paysage</div></div>`;
  document.body.appendChild(el);

  const fit = () => { const r = area.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px'; draw(); };

    el.querySelector('.sighint').style.display = strokes.length ? 'none' : '';

  r.editable.forEach((b, i) => out.push({editable: true, name: base + '_modifiable' + (r.editable.length > 1 ? '_p' + (i + 1) : '') + '.pdf', blob: new Blob([b], {type: 'application/pdf'})}));
  return out;
}
function mailFill(tpl, ve, types){
  const st = S.sites.find(x => x.id === ve.siteId) || {}, f = ficheOf(ve.id, types[0]) || {v: {}};
  const map = {fiche: types.map(t => VCE[t].short).join(' et '), fiches: (types.length > 1 ? 'les fiches ' : 'la fiche ') + types.map(t => VCE[t].short).join(' et '), site: siteName(ve.siteId), date: frDate(f.v.date) || fmtDay(ve.end || ve.start),
    client: f.v.client || st.client || '', idsite: f.v.site || st.idSite || '', inter: f.v.inter || '', tech: f.v.nomTech || S.settings.tech || ''};
  return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => k in map ? map[k] : m);
}
async function mailVce(){
  if (!lastVce) return;
  const {ve, types, files} = lastVce;
  const to = (S.settings.mailTo || '').trim(), subject = mailFill(S.settings.mailSubject || MAIL_SUBJECT, ve, types), body = mailFill(S.settings.mailBody || MAIL_BODY, ve, types);
  const fl = files.map(x => new File([x.blob], x.name, {type: 'application/pdf'}));
  if (to && navigator.clipboard) navigator.clipboard.writeText(to).catch(() => {});
  if (navigator.canShare && navigator.share && navigator.canShare({files: fl})) {
    try {
      await navigator.share({files: fl, title: subject, text: body});
      if (to) toast('📋 Adresse copiée : colle-la dans « À » si elle n\'y est pas');
      return;
    } catch(e) { if (e.name === 'AbortError') return; }
  }
  // Sans partage de fichiers (ordinateur) : fichiers téléchargés + mail pré-rempli à compléter avec les pièces jointes
  files.forEach(x => download(x.name, x.blob, 'application/pdf'));
  location.href = `mailto:${encodeURIComponent(to).replace(/%2C/gi, ',').replace(/%40/g, '@')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  toast('PDF téléchargés : ajoute-les en pièces jointes du mail');
}
async function mailAllVce(veId){
  const ve = S.ves.find(v => v.id === veId), types = ['08', '11'].filter(t => ficheOf(veId, t) && TPL[t]);
  if (!types.length) return toast('Aucune fiche à envoyer');
  openSheet(`<h3>✉️ Préparation du mail</h3><div class="sub">Remplissage de ${types.map(t => VCE[t].short).join(' et ')} sur le téléphone…</div>`);
  try {
    const files = [];
    for (const t of types) {
      const r = await buildVce(ve, t), f = ficheOf(ve.id, t);
      files.push(...vceFiles(t, `${VCE[t].short.replace(' ', '')}_${siteName(ve.siteId).replace(/[\\/:*?"<>|]+/g, '-').trim()}_${(f.v.date || dayInput(Date.now())).split('-').reverse().join('-')}.pdf`, r));
    }
    lastVce = {ve, types, files};
    openSheet(`<h3>✉️ ${types.map(t => VCE[t].short).join(' + ')} prêtes</h3>
      <div class="sub">${files.length} PDF : ${files.map(x => esc(x.name)).join('<br>')}</div>

}

/* ============ Vue Batteries (tous sites) ============ */
function allBatteries(){
  // État le plus récent connu de chaque site = sa dernière VE
  const out = [];
  S.sites.forEach(site => {
    const ve = S.ves.filter(v => v.siteId === site.id).sort((a,b) => b.start - a.start)[0];
    if (!ve) return;
    ve.coffrets.forEach(c => c.bats.forEach(b => out.push({site, ve, c, b, st: batStatus(b), mo: ageMonths(b.pose)})));
  });
  return out.sort((a,b) => a.site.name.localeCompare(b.site.name,'fr',{numeric:true,sensitivity:'base'}) || (b.mo ?? -1) - (a.mo ?? -1));
}
function renderBats(){
  const all = allBatteries();
  const cmp = (a, b) => a.localeCompare(b, 'fr', {numeric: true, sensitivity: 'base'});
  const sec = (st, title) => {
    const l = all.filter(x => x.st === st); if (!l.length) return '';
    // Regroupement par site, sites dans l'ordre alphabétique
    const bySite = {};
    l.forEach(x => (bySite[x.site.id] = bySite[x.site.id] || {site: x.site, ve: x.ve, list: []}).list.push(x));
    const groups = Object.values(bySite).sort((a, b) => cmp(a.site.name, b.site.name));
    return `<h2>${title} (${l.length})</h2>` + groups.map(g => `<div class="card tap" onclick="go('ve','${g.ve.id}')">
      <div class="row"><div class="grow name">🏢 ${esc(g.site.name)}</div>
        <span class="pill ${st === 'unknown' ? 'info' : st}" style="margin:0">${g.list.length} batterie${g.list.length>1?'s':''}</span>
        <div style="font-size:22px;color:var(--muted)">›</div></div>
      ${g.list.sort((a, b) => cmp(a.c.label || '', b.c.label || '')).map(x => `
        <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
          <div class="sub" style="margin:0">${typeIcon(x.c.type)} <b style="color:var(--text)">${esc(x.c.label || 'Coffret')}</b>${x.c.loc ? ' · ' + esc(x.c.loc) : ''}</div>
          ${batPill(x.b)}
        </div>`).join('')}
    </div>`).join('');
  };
  const nSites = new Set(all.filter(x => x.st === 'bad').map(x => x.site.id)).size;
  $('view').innerHTML = all.length ? `
    <div class="sub">Dernier état connu de chaque site (dernière VE), classé par site. Remplacement conseillé tous les <b>${S.settings.ageYears} ans</b>.${nSites ? ` <b style="color:var(--bad)">${nSites} site${nSites>1?'s':''} concerné${nSites>1?'s':''}</b> par un remplacement.` : ''}</div>
    ${sec('bad', '⚠️ À remplacer')}${sec('warn', `⏳ À prévoir (moins de ${S.settings.warnMonths} mois)`)}${sec('unknown', '❓ Date de pose inconnue')}
    <h2>✅ OK : ${all.filter(x => x.st === 'ok').length} batterie${all.filter(x => x.st === 'ok').length>1?'s':''}</h2>`
    : '<div class="empty">Aucune batterie enregistrée.<br>Elles apparaîtront ici dès ta première VE.</div>';
}

/* ============ Sauvegarde OneDrive par le menu Partager (l'appli ne se connecte jamais à OneDrive) ============ */
const BK_APP = 'batteries-ve';
const hasData = () => S.ves.length + S.sites.length > 0 || Object.keys(FICHES).length > 0;
const hm = t => new Date(t).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
const whenTxt = t => new Date(t).toDateString() === new Date().toDateString() ? `aujourd'hui à ${hm(t)}`
  : new Date(t).toDateString() === new Date(Date.now() - 864e5).toDateString() ? `hier à ${hm(t)}` : `le ${fmtDay(t)} à ${hm(t)}`;
function bkState(){ if (!BK.lastSent) return 'gris'; return (BK.lastMod || 0) > BK.lastSent ? 'orange' : 'vert'; }
function bkUi(){
  const b = $('bkBar'); if (!b) return;
  const st = bkState(); b.className = 'bkbar ' + st;
  b.textContent = st === 'orange' ? '📤 Modifications pas encore sur OneDrive — touche ici pour les envoyer'
    : st === 'vert' ? `☁️ Tout est sur OneDrive ✓ (envoyé ${whenTxt(BK.lastSent)})`
    : hasData() ? 'Pas encore de sauvegarde — touche ici pour en faire une' : 'Pas encore de sauvegarde — touche ici pour charger ou faire une sauvegarde';
}
function bkFile(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `${BK_APP} ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}h${p(d.getMinutes())}.txt`;
  const body = JSON.stringify({app: BK_APP, version: APP_VERSION, updated: BK.lastMod || Date.now(), data: S, fiches: FICHES, signature: mySig() || ''}, null, 1);
  return {name, body};
}
async function sendBackup(){
  if (!hasData()) return openSheet(`<h3>☁️ Sauvegarde</h3><div class="sub">Il n'y a encore aucune donnée sur ce téléphone.</div>
    <button class="btn primary block" onclick="closeSheet();pickBackup()">📥 Charger une sauvegarde depuis OneDrive</button><button class="btn block" onclick="closeSheet()">Fermer</button>`);
  const {name, body} = bkFile(), sentMod = BK.lastMod || Date.now();
  const file = new File([body], name, {type: 'text/plain'}); // .txt : Chrome Android refuse de partager les .json
  let canShare = false; try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({files: [file]})); } catch(e){}
  if (canShare) {
    try {
      await navigator.share({files: [file], title: name});
      BK.lastSent = Math.max(Date.now(), sentMod); saveBK(); bkUi(); toast('✅ Sauvegarde envoyée');
      return;
    } catch(e) {
      if (e && e.name === 'AbortError') { toast('Envoi annulé'); bkUi(); return; }
      // autre refus du partage : on bascule sur le téléchargement ci-dessous
    }
  }
  download(name, body, 'text/plain');
  openSheet(`<h3>📥 Fichier téléchargé</h3>
    <div class="sub">Le partage n'est pas possible ici, alors la sauvegarde <b>${esc(name)}</b> a été téléchargée dans le dossier <b>Téléchargements</b> du téléphone.</div>
    <div class="sub">Pour la mettre sur OneDrive : ouvre l'appli <b>OneDrive</b> › <b>+</b> › <b>Importer</b> › choisis ce fichier.</div>
    <div class="hint">Le bandeau reste orange : l'appli ne peut pas savoir si le fichier est bien arrivé sur OneDrive.</div>
    <button class="btn block" onclick="closeSheet()">OK</button>`);
}
function pickBackup(){ $('impBk').click(); }
async function loadBackup(file){
  if (!file) return;
  const fail = msg => openSheet(`<h3>📥 Charger une sauvegarde</h3><div class="alertbar bad">⛔ <div class="grow">${msg}</div></div><button class="btn block" onclick="closeSheet()">OK</button>`);
  let txt = '';
  try { txt = await file.text(); } catch(e){ return fail('Impossible de lire ce fichier. Réessaie, ou télécharge-le d\'abord sur le téléphone depuis l\'appli OneDrive.'); }
  txt = txt.replace(/^﻿/, '').trim();
  if (!txt) return fail(`Le fichier « ${esc(file.name)} » est vide.`);
  let o; try { o = JSON.parse(txt); } catch(e){
    return fail(txt[0] !== '{' ? `Mauvais fichier choisi : « ${esc(file.name)} » n'est pas une sauvegarde Batteries VE.` : `Le fichier « ${esc(file.name)} » est abîmé (contenu incomplet ou modifié). Choisis une autre sauvegarde.`);
  }
  let data, updated, fiches = null, sig = '';
  if (o && o.app && o.data !== undefined) {
    if (o.app !== BK_APP) return fail(`Mauvais fichier choisi : c'est une sauvegarde d'une autre appli (« ${esc(String(o.app))} »), pas de Batteries VE.`);
    data = o.data; updated = +o.updated || 0;
    if (o.fiches && typeof o.fiches === 'object' && !Array.isArray(o.fiches)) fiches = o.fiches;
    if (typeof o.signature === 'string' && o.signature.startsWith('data:image/')) sig = o.signature;
  } else if (o && Array.isArray(o.ves)) { data = o; updated = Date.parse(o.exportedAt || '') || 0; } // anciennes sauvegardes .json
  else return fail(`Mauvais fichier choisi : « ${esc(file.name)} » n'est pas une sauvegarde Batteries VE.`);
  if (!data || !Array.isArray(data.ves) || !Array.isArray(data.sites || [])) return fail(`Le fichier « ${esc(file.name)} » est abîmé : les données sont incomplètes.`);
  const apply = () => {
    snapshot(); undoExtra = {fiches: JSON.stringify(FICHES), sig: mySig()}; delete data.exportedAt;
    S = Object.assign(defaults(), data, {settings: Object.assign(defaults().settings, data.settings || {})});
    quietSave = true; save();
    if (fiches) { FICHES = fiches; saveFiches(); }
    if (sig) try { localStorage.setItem(SIGKEY, sig); } catch(e){}
    quietSave = false;
    BK.lastMod = updated || Date.now(); BK.lastSent = BK.lastMod; saveBK();
    const nF = Object.values(FICHES).reduce((n, x) => n + Object.keys(x || {}).length, 0);
    closeSheet(); render(); offerUndo(`📥 Sauvegarde chargée : ${S.ves.length} VE, ${S.sites.length} site${S.sites.length > 1 ? 's' : ''}, ${nF} fiche${nF > 1 ? 's' : ''} VCE`);
  };
  window._bkApply = apply;
  if (!hasData() || updated > (BK.lastMod || 0)) return apply();
  openSheet(`<h3>📥 Déjà à jour</h3>
    <div class="sub">Les données de ce téléphone sont aussi récentes (ou plus) que cette sauvegarde${updated ? ` du ${fmtDay(updated)} à ${hm(updated)}` : ''}. Rien n'a été changé.</div>
    <button class="btn block" onclick="closeSheet()">OK</button>
    <button class="btn block" style="color:var(--bad)" onclick="if(confirm('Remplacer les données du téléphone par cette sauvegarde plus ancienne ?')) window._bkApply()">Remplacer quand même</button>`);
}
// Sauvegarde .json envoyée via le menu « Partager » du téléphone : OneDrive (pro ou perso), Drive, Fichiers…
async function shareBackup(){
  if (isEmpty()) return toast('Rien à sauvegarder : aucune donnée sur ce téléphone');
  const name = `batteries-ve ${stamp(new Date()).replace('_', ' ')}.json`, json = JSON.stringify(Object.assign({}, S, {exportedAt: new Date().toISOString()}), null, 1);
  const file = new File([json], name, {type: 'application/json'});
  const done = () => { S.lastBackup = Date.now(); quietSave = true; save(); quietSave = false; backupDone(); render(); };
  try {
    if (navigator.canShare && navigator.share && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: name});
      done(); toast('✅ Sauvegarde envoyée'); return;
    }
  } catch(e){ if (e.name === 'AbortError') return; }
  download(name, json, 'application/json'); done();
  toast('Sauvegarde téléchargée : ouvre l\'appli OneDrive › + › Importer pour la ranger');
}
function exportData(){ S.lastBackup = Date.now(); save(); render(); download(`batteries-ve-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S, null, 1), 'application/json'); }
function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.ves)) throw 0;
      if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.ves.length} VE) ?`)) return;
      snapshot(); S = Object.assign(defaults(), d, {settings: Object.assign(defaults().settings, d.settings || {})}); save(); render(); offerUndo('Sauvegarde importée'); }
    catch(e){ toast('Fichier de sauvegarde invalide'); }
  };
  r.readAsText(file);
}
function resetAll(){
  if (!confirm('Effacer toutes les VE, sites et batteries de ce téléphone ?')) return;
  snapshot(); const keep = S.settings.odClientId; S = defaults(); S.settings.odClientId = keep; save(); render(); offerUndo('Données effacées');
}

  const bats = allBatteries();
  const mes = [];
  S.ves.slice().sort((a,b) => b.start - a.start).forEach(ve => ve.coffrets.forEach(c => mes.push({ve, c})));
  return XlsxLite.tablesWorkbook([
    {name: 'Batteries', headers: ['Site', 'Coffret', 'Localisation', 'Type', 'Capacité (Ah)', 'Date de pose', 'Âge', 'Statut'],

     red: bats.map(x => x.st === 'bad'), center: [4, 5, 6, 7], widths: [28, 26, 26, 16, 12, 12, 14, 14]},
    {name: 'Mesures', headers: ['Début VE', 'Fin VE', 'Site', 'Coffret', 'Type', 'Sous tension (V)', 'Hors tension (V)', 'Conso', 'Unité', 'Batteries', 'Remarque'],
     rows: mes.map(({ve, c}) => [fmtDay(ve.start), fmtDay(ve.end), siteName(ve.siteId), c.label, typeLabel(c.type), num(c.vOn) ?? '', num(c.vOff) ?? '', num(c.conso) ?? '', c.unit, c.bats.map(b => `${fmtCap(b.cap)}Ah ${fmtPose(b.pose)}${b.replaced ? ' (remplacée)' : ''}`).join(' + '), c.note || '']),
     center: [0, 1, 5, 6, 7, 8], widths: [12, 12, 26, 26, 16, 15, 15, 10, 7, 34, 34]},
    {name: 'Carnet', headers: ['Site', 'Début', 'Fin', 'Statut', 'Coffrets', 'Texte du carnet'],
     rows: S.ves.slice().sort((a,b) => b.start - a.start).map(ve => [siteName(ve.siteId), fmtDay(ve.start), fmtDay(ve.end), ve.closed ? 'Clôturée' : 'En cours', ve.coffrets.length, ve.carnetEdited && ve.carnet ? ve.carnet : carnetAuto(ve)]),
     center: [1, 2, 3, 4], widths: [26, 12, 12, 11, 9, 100]}
  ]);
}
function exportXlsx(){ download(`batteries-ve-${new Date().toISOString().slice(0,10)}.xlsx`, buildXlsx(), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }

function openSheet(html){ $('sheet').innerHTML = html; $('sheetBg').classList.add('show'); $('undoBar').classList.remove('show'); }
function closeSheet(){ $('sheetBg').classList.remove('show'); if (undoSnap && document.body.classList.contains('undo-on')) $('undoBar').classList.add('show'); }

/* ============ Annuler ============ */
let undoSnap = null, undoTimer = null;
function snapshot(){ undoSnap = JSON.stringify(S); }
function setNavH(){ const n = document.querySelector('nav'); if (n) document.documentElement.style.setProperty('--navh', n.offsetHeight + 'px'); }
function offerUndo(msg){
  if (!undoSnap) return;
  $('undoMsg').textContent = msg; setNavH();
  if (!$('sheetBg').classList.contains('show')) $('undoBar').classList.add('show');
  document.body.classList.add('undo-on');

}
let undoExtra = null;
function hideUndo(){ undoSnap = null; undoExtra = null; clearTimeout(undoTimer); $('undoBar').classList.remove('show'); document.body.classList.remove('undo-on'); }
function undo(){
  if (!undoSnap) return;
  if (undoExtra) { const x = undoExtra; FICHES = JSON.parse(x.fiches); saveFiches(); try { x.sig ? localStorage.setItem(SIGKEY, x.sig) : localStorage.removeItem(SIGKEY); } catch(e){} }
  S = JSON.parse(undoSnap); hideUndo(); save(); closeSheet(); render(); toast('↩️ Action annulée');
}
